# Cloud Build: construye la imagen Docker, la publica en Artifact Registry
# y la despliega en Cloud Run conectada a Cloud SQL (PostgreSQL).
#
# Se ejecuta desde GitHub Actions (.github/workflows/deploy.yml) o a mano con:
#   gcloud builds submit --config cloudbuild.yaml --substitutions=_TAG=manual-1

substitutions:
  _REGION: us-central1
  _SERVICE: consultorio-san-rafael
  _REPO: consultorio
  _SQL_INSTANCE: consultorio-db            # nombre de la instancia de Cloud SQL
  _DB_NAME: consultorio_san_rafael
  _DB_USER: postgres
  _RUN_SA: consultorio-run                 # cuenta de servicio con la que corre la app
  _SMTP_USER: paezp2420@gmail.com         # Gmail del consultorio (la contraseña va en Secret Manager: smtp-pass)
  _TAG: manual

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

steps:
  # 1. Construir la imagen
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  # 2. Publicar la imagen en Artifact Registry
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}']

  # 3. Desplegar en Cloud Run
  #    Las credenciales NO están en el código: vienen de Secret Manager (--set-secrets).
  #    DB_HOST apunta al socket de Cloud SQL que Cloud Run monta en /cloudsql/.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --service-account=${_RUN_SA}@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances=$PROJECT_ID:${_REGION}:${_SQL_INSTANCE}
      # Separador "^|^" porque la dirección del consultorio contiene comas
      - >-
        --set-env-vars=^|^NODE_ENV=production|DB_HOST=/cloudsql/$PROJECT_ID:${_REGION}:${_SQL_INSTANCE}|DB_PORT=5432|DB_NAME=${_DB_NAME}|DB_USER=${_DB_USER}|CLINIC_NAME=Consultorio Médico San Rafael|CLINIC_PHONE=(809) 555-0199|CLINIC_ADDRESS=Av. San Rafael #102, Santiago de los Caballeros|IMECF_API_BASE_URL=https://ecf-platform-backend-50801509587.us-central1.run.app|ECF_AMBIENTE=TesteCF|IMECF_ALLOW_PRODUCTION=false|ECF_DEFAULT_INDICADOR_FACTURACION=4|ECF_SIMULATION_MODE=false|ECF_REQUEST_TIMEOUT_MS=20000|PAYPAL_ENV=sandbox|PAYPAL_CLIENT_ID=COLOCAR_PAYPAL_CLIENT_ID_SANDBOX|PAYPAL_WEBHOOK_ID=COLOCAR_PAYPAL_WEBHOOK_ID_SANDBOX|PAYPAL_CURRENCY=USD|PAYPAL_DOP_TO_USD_RATE=60.00|PAYPAL_SIMULATION_MODE=false|SMTP_HOST=smtp.gmail.com|SMTP_PORT=587|SMTP_USER=${_SMTP_USER}|SMTP_FROM=${_SMTP_USER}|SMTP_FROM_NAME=Consultorio San Rafael
      - --set-secrets=SESSION_SECRET=session-secret:latest,DB_PASSWORD=db-password:latest,IMECF_API_KEY=imecf-api-key:latest,PAYPAL_CLIENT_SECRET=paypal-client-secret:latest,SMTP_PASS=smtp-pass:latest

